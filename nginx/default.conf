# DNS interno de Docker: nginx detecta las réplicas al escalar sin reiniciarse.
resolver 127.0.0.11 valid=5s ipv6=off;

log_format upstreamlog '$remote_addr "$request" $status upstream=$upstream_addr time=$upstream_response_time';

upstream api_backend {
  zone api_backend 64k;
  server api:3000 resolve;
  keepalive 64;
}

upstream web_backend {
  zone web_backend 64k;
  server web:3000 resolve;
}

server {
  listen 80;
  access_log /var/log/nginx/access.log upstreamlog;

  location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_connect_timeout 2s;
  }

  location / {
    proxy_pass http://web_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
