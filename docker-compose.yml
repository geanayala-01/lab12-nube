name: pronostica

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pronostica
      POSTGRES_USER: pronostica
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pronostica -d pronostica"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://pronostica:${DB_PASSWORD}@db:5432/pronostica
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SCORING_CUMULATIVE: ${SCORING_CUMULATIVE:-true}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: ${API_REPLICAS:-3}
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  k6:
    image: grafana/k6:latest
    profiles: ["stress"]
    volumes:
      - ./tests:/tests
    environment:
      BASE_URL: http://nginx
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      - nginx

volumes:
  db-data:
